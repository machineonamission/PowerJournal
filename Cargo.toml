[package]
name = "powerjournal"
version = "0.1.0"
authors = ["Machine on a Mission <machineonamission@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = { version = "1.0.104", features = ["std", "backtrace"] }
dioxus = { version = "0.7.10", features = ["router",] }
sea-orm = { version = "2.0.0", features = ["sqlx-sqlite", "runtime-tokio-native-tls", "macros",
    "with-chrono", "with-json", "schema-sync", "entity-registry"]}
zip = "8.6.0"
dirs = "6.0.0"
base64 = "0.23.0"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
chrono = "0.4.45"
scraper = "0.27.0"
path-clean = "1.0.1"
lightningcss = "1.0.0-alpha.72"
glam = "0.33.2"
dioxus_google_font_embedder = "1"
http = "1.5.0"
heic = "0.1.6"
image = { version = "0.25.10", features = ["png"] }
infer = "0.22.0"
bytes = "1.12.1"

[features]
default = ["desktop"]
#i dont think you can compile sea-orm for wasm, lmfao
#web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
